name: Deploy Storybook

on:
  push:
    branches: [main]
  # Lets a broken deploy be retried without an empty commit.
  workflow_dispatch:

# Pages allows one concurrent deployment. Unlike CI, an in-flight deploy is not
# cancelled — a half-finished upload would leave the published site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # As in ci.yml, `npm ci` triggers `prepare`, which runs the library build.
      - run: npm ci

      # Pages must already be switched on for the repo; this step reads that
      # config, it cannot create it. `enablement: true` looks like the fix and
      # is not — creating a Pages site needs admin rights, which GITHUB_TOKEN
      # does not have and `permissions:` cannot grant. It fails with an opaque
      # "Resource not accessible by integration" instead of the plain "verify
      # that the repository has Pages enabled" you get without it. Self-enabling
      # would take a PAT, which is not worth storing for a one-time setup step.
      #
      # It was switched on out-of-band on 2 Aug 2026, which is what turned this
      # workflow green after 8 straight failures:
      #   gh api -X POST repos/lizzie-teo/conjure-ui/pages -f build_type=workflow
      - uses: actions/configure-pages@v5

      # Restoring the parked custom domain needs no change here: Vite's default
      # publicDir copies `public/` into the build on its own, so a public/CNAME
      # reaches the published root without a `staticDirs` entry. The entry that
      # used to sit there was redundant, which is why deleting it did not stop
      # the file shipping.
      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - id: deployment
        uses: actions/deploy-pages@v4
